<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Shop Candy</title>
  <meta name="description" content="View product specifications, select size and color, and place your preorder securely.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .product-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .gallery-main {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: var(--radius-md);
      background-color: #f3f4f6;
      border: 1px solid var(--border-color);
    }
    .thumbnail-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      overflow-x: auto;
    }
    .thumb-btn {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      background: #f3f4f6;
    }
    .thumb-btn.active {
      border-color: var(--accent-color);
    }
    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .option-group {
      margin-bottom: 1rem;
    }
    .option-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }
    @media (min-width: 768px) {
      .product-layout {
        grid-template-columns: 1fr 1fr;
        gap: 2.5rem;
        align-items: start;
      }
    }
  </style>
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="container header-nav">
      <a href="index.html" class="logo">Shop Candy </a>
      
      <nav style="display: flex; align-items: center; gap: 1rem;">
        <a href="index.html" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);"><i class="fa-solid fa-arrow-left"></i> Back to Shop</a>
        <a href="cart.html" class="cart-icon-btn" aria-label="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="container">
    <div id="product-container" style="padding: 1rem 0;">
      
      <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 0.5rem;"></i>
        <p>Loading product details...</p>
      </div>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <div class="container">
      <p style="font-weight: 700; color: var(--text-main);">Shop Candy Nigeria 🇳🇬</p>
      <p style="font-size: 0.85rem; margin-top: 0.25rem;">All prices shown in Nigerian Naira (₦). No currency conversion hassle.</p>
      
      <div class="social-links">
        <a href="https://wa.me/2348012345678" target="_blank" class="social-link"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
        <a href="https://instagram.com" target="_blank" class="social-link"><i class="fa-brands fa-instagram"></i> Instagram</a>
        <a href="refund-policy.html" class="social-link"><i class="fa-solid fa-shield-halved"></i> Refund Policy</a>
      </div>
      
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem;">&copy; 2026 Shop Candy. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  
<script>
   
    let currentProduct = null;

    document.addEventListener("DOMContentLoaded", async () => {
      updateCartBadge();

      // Parse product ID from query parameter e.g., product.html?id=sc-123456
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");

      const container = document.getElementById("product-container");

      if (!productId) {
        showNotFoundError(container);
        return;
      }

      
      const products = await ShopCandyData.getProducts();
      currentProduct = products.find(p => p.id === productId);

      if (!currentProduct || currentProduct.hidden) {
        showNotFoundError(container);
        return;
      }

      
      const images = currentProduct.images && currentProduct.images.length > 0 ? currentProduct.images : ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80'];
      
      container.innerHTML = `
        <div class="product-layout">
          <!-- Image Gallery Column -->
          <div>
            <img id="main-gallery-img" src="${images[0]}" alt="${currentProduct.name}" class="gallery-main">
            ${images.length > 1 ? `
              <div class="thumbnail-row">
                ${images.map((img, idx) => `
                  <button class="thumb-btn ${idx === 0 ? 'active' : ''}" onclick="changeImage('${img}', this)">
                    <img src="${img}" alt="Thumbnail ${idx + 1}">
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <!-- Details & Actions Column -->
          <div>
            <span class="badge" style="position: static; display: inline-block; margin-bottom: 0.5rem;">${currentProduct.badge || 'Preorder'}</span>
            <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-main);">${currentProduct.name}</h1>
            <div style="font-size: 1.35rem; font-weight: 800; color: var(--accent-color); margin-bottom: 1rem;">${ShopCandyData.formatNaira(currentProduct.price)}</div>
            
            <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem;">${currentProduct.description}</p>

            <!-- Size Dropdown -->
            ${currentProduct.sizes && currentProduct.sizes.length > 0 ? `
              <div class="option-group">
                <label for="selected-size">Select Size:</label>
                <select id="selected-size" class="input-field">
                  ${currentProduct.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
                </select>
              </div>
            ` : ''}

            <!-- Color Dropdown -->
            ${currentProduct.colors && currentProduct.colors.length > 0 ? `
              <div class="option-group">
                <label for="selected-color">Select Color:</label>
                <select id="selected-color" class="input-field">
                  ${currentProduct.colors.map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
              </div>
            ` : ''}

            <!-- Quantity -->
            <div class="option-group">
              <label for="selected-qty">Quantity:</label>
              <input type="number" id="selected-qty" class="input-field" value="1" min="1" max="10" style="max-width: 120px;">
            </div>

            <!-- Mandatory Preorder Notice -->
            <div class="notice-box">
              <i class="fa-solid fa-clock"></i> <strong>Preorder Notice:</strong> Estimated arrival is about 2 weeks after your order is confirmed and paid.
            </div>

            <!-- Add to Cart Button -->
            <button class="btn btn-primary" onclick="addToCart()" style="margin-top: 0.5rem;">
              <i class="fa-solid fa-cart-plus" style="margin-right: 0.5rem;"></i> Add to Cart
            </button>
          </div>
        </div>
      `;
    });

    function showNotFoundError(container) {
      container.innerHTML = `
        <div style="text-align: center; padding: 4rem 1rem;">
          <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 1rem;"></i>
          <h2 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Product Not Found</h2>
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;">The item you are looking for is unavailable or has been removed.</p>
          <a href="index.html" class="btn btn-primary" style="display:inline-flex; width: auto;">Return to Home</a>
        </div>
      `;
    }

   
    function changeImage(src, btnElement) {
      document.getElementById("main-gallery-img").src = src;
      document.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");
    }

    
    function addToCart() {
      if (!currentProduct) return;

      const sizeSelect = document.getElementById("selected-size");
      const colorSelect = document.getElementById("selected-color");
      const qtyInput = document.getElementById("selected-qty");

      const selectedSize = sizeSelect ? sizeSelect.value : "Standard";
      const selectedColor = colorSelect ? colorSelect.value : "Standard";
      const quantity = qtyInput ? parseInt(qtyInput.value) || 1 : 1;

      let cart = ShopCandyData.getCart();

      
      const existingIndex = cart.findIndex(item => 
        item.id === currentProduct.id && item.size === selectedSize && item.color === selectedColor
      );

      if (existingIndex > -1) {
        cart[existingIndex].quantity += quantity;
      } else {
        cart.push({
          id: currentProduct.id,
          name: currentProduct.name,
          price: currentProduct.price,
          image: currentProduct.images && currentProduct.images[0] ? currentProduct.images[0] : '',
          size: selectedSize,
          color: selectedColor,
          quantity: quantity
        });
      }

      ShopCandyData.saveCart(cart);
      updateCartBadge();

      alert(`Success! "${currentProduct.name}" (${selectedSize} / ${selectedColor}) has been added to your cart.`);
    }
  </script>

</body>
</html>
