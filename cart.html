<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Shop Candy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="header">
    <div class="container header-nav">
      <a href="index.html" class="logo">Shop Candy </a>
      <a href="index.html" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h1 class="section-title" style="text-align: left; font-size: 1.6rem;"><i class="fa-solid fa-bag-shopping"></i> Your Shopping Cart</h1>
      <div id="cart-content-area"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => renderCartPage());

    function renderCartPage() {
      const cart = ShopCandyData.getCart();
      const container = document.getElementById("cart-content-area");

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 4rem 1rem; background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
            <i class="fa-solid fa-cart-shopping" style="font-size: 3rem; color: var(--border-color); margin-bottom: 1rem;"></i>
            <h2 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Your cart is empty</h2>
            <a href="index.html" class="btn btn-primary" style="display: inline-flex; width: auto; margin-top: 1rem;">Start Shopping</a>
          </div>
        `;
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      container.innerHTML = `
        <div>
          ${cart.map((item, index) => `
            <div style="display: flex; gap: 1rem; background: var(--bg-card); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 1rem; align-items: center;">
              <img src="${item.image}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 6px;" alt="">
              <div style="flex-grow: 1;">
                <h3 style="font-size: 0.95rem; font-weight: 700;">${item.name}</h3>
                <p style="font-size: 0.82rem; color: var(--text-muted);">Size: ${item.size} | Color: ${item.color}</p>
                <div style="font-weight: 800; color: var(--accent-color);">${ShopCandyData.formatNaira(item.price)}</div>
              </div>
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <button class="btn btn-outline" style="min-height: 30px; padding: 0.2rem 0.6rem;" onclick="updateQty(${index}, -1)">-</button>
                  <span style="font-weight: 700;">${item.quantity}</span>
                  <button class="btn btn-outline" style="min-height: 30px; padding: 0.2rem 0.6rem;" onclick="updateQty(${index}, 1)">+</button>
                </div>
                <button style="background: none; border: none; color: #ef4444; font-size: 0.8rem; cursor: pointer; font-weight: 600;" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i> Remove</button>
              </div>
            </div>
          `).join('')}

          <div style="background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-top: 1.5rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 1.1rem; font-weight: 800;">
              <span>Items Subtotal:</span>
              <span style="color: var(--accent-color);">${ShopCandyData.formatNaira(subtotal)}</span>
            </div>
            <a href="checkout.html" class="btn btn-primary" style="text-align: center;">Proceed to Checkout</a>
          </div>
        </div>
      `;
    }

    function updateQty(index, change) {
      let cart = ShopCandyData.getCart();
      cart[index].quantity += change;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      ShopCandyData.saveCart(cart);
      renderCartPage();
    }

    function removeItem(index) {
      let cart = ShopCandyData.getCart();
      cart.splice(index, 1);
      ShopCandyData.saveCart(cart);
      renderCartPage();
    }
  </script>
</body>
</html>
